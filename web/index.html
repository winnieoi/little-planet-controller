<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1d" />
    <meta name="description" content="口袋星球合并版主菜单：进入探索游戏、手柄调试、双人模式与原版星球。" />
    <title>口袋星球：漫游 · 主菜单</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #070b1d;
        color: #f4f0ff;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      }

      body {
        overflow: hidden;
      }

      .shell {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        isolation: isolate;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        z-index: -3;
        background-image: url("./assets/menu-background.jpg");
        background-size: cover;
        background-position: center;
        filter: saturate(1.06) contrast(1.04);
      }

      .shade {
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(90deg, rgba(4, 6, 20, 0.96) 0%, rgba(5, 7, 22, 0.9) 28%, rgba(5, 7, 22, 0.18) 58%, rgba(5, 7, 22, 0.52) 100%),
          linear-gradient(180deg, rgba(4, 6, 20, 0.34), rgba(4, 6, 20, 0.18) 54%, rgba(4, 6, 20, 0.72));
      }

      .grain {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(90deg, #000 0%, #000 46%, transparent 80%);
      }

      .menu {
        width: min(430px, calc(100vw - 40px));
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 42px 0 42px 56px;
      }

      .brand {
        margin-bottom: 44px;
      }

      .brand-mark {
        width: 78px;
        height: 56px;
        margin-bottom: 10px;
        color: #dfe6ff;
        filter: drop-shadow(0 0 18px rgba(150, 170, 255, 0.62));
      }

      .brand-mark * {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        margin: 0;
        max-width: 320px;
        font-size: 54px;
        line-height: 0.98;
        font-weight: 800;
        letter-spacing: 0;
        text-shadow: 0 0 18px rgba(173, 184, 255, 0.72), 0 0 38px rgba(84, 112, 255, 0.42);
      }

      .subtitle {
        margin: 14px 0 0;
        font-size: 20px;
        line-height: 1.25;
        color: #f0ecff;
        font-family: "Segoe Print", "Comic Sans MS", "PingFang SC", cursive;
        text-shadow: 0 0 12px rgba(183, 198, 255, 0.54);
      }

      .kicker {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.6;
        text-transform: uppercase;
        color: rgba(244, 240, 255, 0.74);
        letter-spacing: 0;
      }

      .actions {
        display: grid;
        gap: 16px;
        width: 100%;
      }

      .menu-button {
        position: relative;
        min-height: 76px;
        display: grid;
        grid-template-columns: 54px 1fr 28px;
        align-items: center;
        gap: 14px;
        padding: 11px 18px 11px 16px;
        border: 1px solid rgba(187, 194, 255, 0.36);
        border-radius: 8px;
        background: rgba(14, 18, 55, 0.5);
        color: #f6f3ff;
        text-decoration: none;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 12px 26px rgba(0, 0, 0, 0.26);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
      }

      .menu-button::before {
        content: "";
        position: absolute;
        inset: 3px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        pointer-events: none;
      }

      .menu-button.primary,
      .menu-button:focus-visible {
        border-color: rgba(162, 187, 255, 0.92);
        background: linear-gradient(90deg, rgba(80, 93, 214, 0.86), rgba(69, 93, 182, 0.58));
        box-shadow: 0 0 0 1px rgba(160, 190, 255, 0.24), 0 0 22px rgba(103, 132, 255, 0.42), 0 16px 36px rgba(0, 0, 0, 0.34);
        outline: none;
      }

      .menu-button:hover {
        transform: translateX(4px);
        border-color: rgba(225, 231, 255, 0.88);
        background: rgba(44, 53, 130, 0.74);
      }

      .menu-button svg {
        width: 45px;
        height: 45px;
        color: #dfe6ff;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .label {
        min-width: 0;
      }

      .label strong {
        display: block;
        font-size: 24px;
        line-height: 1.12;
        font-weight: 760;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .label span {
        display: block;
        margin-top: 3px;
        color: rgba(235, 238, 255, 0.72);
        font-size: 13px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .arrow {
        font-size: 34px;
        line-height: 1;
        color: rgba(238, 241, 255, 0.74);
      }

      .tagline {
        margin-top: 44px;
        max-width: 260px;
        font-size: 20px;
        line-height: 1.55;
        color: rgba(244, 240, 255, 0.92);
        text-shadow: 0 0 14px rgba(157, 173, 255, 0.5);
      }

      .status {
        position: fixed;
        right: 54px;
        top: 42px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: rgba(246, 245, 255, 0.88);
        background: rgba(9, 13, 36, 0.28);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-size: 13px;
        line-height: 1.3;
      }

      .status i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9af1ff;
        box-shadow: 0 0 12px #9af1ff;
      }

      .footer-note {
        position: fixed;
        right: 58px;
        bottom: 44px;
        max-width: 190px;
        color: rgba(246, 245, 255, 0.68);
        font-size: 11px;
        line-height: 1.55;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      @media (max-width: 760px) {
        body {
          overflow: auto;
        }

        .shade {
          background:
            linear-gradient(180deg, rgba(4, 6, 20, 0.92) 0%, rgba(4, 6, 20, 0.78) 45%, rgba(4, 6, 20, 0.68) 100%),
            linear-gradient(90deg, rgba(4, 6, 20, 0.86), rgba(4, 6, 20, 0.28));
        }

        .grain {
          mask-image: none;
        }

        .menu {
          width: 100%;
          min-height: 100vh;
          padding: 34px 20px 40px;
          justify-content: flex-start;
        }

        .actions {
          width: 100%;
          max-width: calc(100vw - 40px);
        }

        .brand {
          margin-bottom: 28px;
        }

        .brand-mark {
          width: 62px;
          height: 46px;
        }

        h1 {
          max-width: 340px;
          font-size: 38px;
          line-height: 1.08;
        }

        .subtitle {
          font-size: 17px;
        }

        .menu-button {
          width: 100%;
          max-width: calc(100vw - 40px);
          min-width: 0;
          min-height: 70px;
          grid-template-columns: 46px 1fr 22px;
          gap: 12px;
          padding: 10px 14px;
        }

        .menu-button:hover {
          transform: none;
        }

        .menu-button.primary,
        .menu-button:focus-visible {
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 10px 24px rgba(0, 0, 0, 0.34);
        }

        .menu-button svg {
          width: 38px;
          height: 38px;
        }

        .label strong {
          font-size: 21px;
        }

        .status,
        .footer-note {
          position: static;
          margin-top: 24px;
          max-width: none;
          width: fit-content;
        }

        .footer-note {
          margin-top: 18px;
        }

        .tagline {
          margin-top: 30px;
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="backdrop" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <aside class="menu" aria-label="主菜单">
        <section class="brand">
          <svg class="brand-mark" viewBox="0 0 90 64" aria-hidden="true">
            <circle cx="38" cy="31" r="15"></circle>
            <ellipse cx="38" cy="31" rx="31" ry="9" transform="rotate(-24 38 31)"></ellipse>
            <ellipse cx="38" cy="31" rx="7" ry="21" transform="rotate(-16 38 31)"></ellipse>
            <path d="M68 13l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z"></path>
            <path d="M16 7l1.5 3.8L21 12l-3.5 1.2L16 17l-1.5-3.8L11 12l3.5-1.2L16 7Z"></path>
          </svg>
          <h1>口袋星球：漫游</h1>
          <p class="subtitle">Little Planet</p>
          <p class="kicker">A Pocket Adventure</p>
        </section>

        <nav class="actions" aria-label="菜单选项">
          <a class="menu-button primary" href="./game.html?planet=cyber">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="22" cy="24" r="11"></circle>
              <ellipse cx="22" cy="24" rx="19" ry="6" transform="rotate(-26 22 24)"></ellipse>
              <path d="M36 10l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6 1.6-4Z"></path>
            </svg>
            <span class="label">
              <strong>开始探索</strong>
              <span>Start Adventure</span>
            </span>
            <span class="arrow" aria-hidden="true">›</span>
          </a>

          <a class="menu-button" href="./controller-debug/index.html">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M14 19h20a8 8 0 0 1 7.6 5.5l2 6.2a5.5 5.5 0 0 1-9.2 5.5l-4.2-4.2H17.8l-4.2 4.2a5.5 5.5 0 0 1-9.2-5.5l2-6.2A8 8 0 0 1 14 19Z"></path>
              <path d="M15 27h8M19 23v8"></path>
              <circle cx="32.5" cy="25.5" r="1.5"></circle>
              <circle cx="37.5" cy="29.5" r="1.5"></circle>
            </svg>
            <span class="label">
              <strong>手柄调试</strong>
              <span>Controller Debug</span>
            </span>
            <span class="arrow" aria-hidden="true">›</span>
          </a>

          <a class="menu-button" href="./duo.html?planet=cyber">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M12 14h24a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4Z"></path>
              <path d="M24 14v25M15 24h6M18 21v6M32 23h.1M35 28h.1"></path>
            </svg>
            <span class="label">
              <strong>双人协作</strong>
              <span>Duo Play</span>
            </span>
            <span class="arrow" aria-hidden="true">›</span>
          </a>

          <a class="menu-button" href="./game.html">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M9 12l10-4 10 4 10-4v28l-10 4-10-4-10 4V12Z"></path>
              <path d="M19 8v28M29 12v28"></path>
            </svg>
            <span class="label">
              <strong>原版星球</strong>
              <span>Classic Planet</span>
            </span>
            <span class="arrow" aria-hidden="true">›</span>
          </a>
        </nav>

        <p class="tagline">一起出发，去更大的世界。</p>
      </aside>

      <div class="status" aria-label="当前模式"><i aria-hidden="true"></i><span>双人协作探索 · 寻找 7 颗数字奇迹</span></div>
      <p class="footer-note">Two players · One planet · Infinite possibilities</p>
    </main>

    <script>
      const buttons = Array.from(document.querySelectorAll(".menu-button"));
      let index = 0;

      function focusButton(nextIndex) {
        index = (nextIndex + buttons.length) % buttons.length;
        buttons[index].focus();
      }

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "s" || event.key === "S") {
          event.preventDefault();
          focusButton(index + 1);
        }
        if (event.key === "ArrowUp" || event.key === "w" || event.key === "W") {
          event.preventDefault();
          focusButton(index - 1);
        }
      });

      let previousPadState = { up: false, down: false, confirm: false };
      function pollGamepad() {
        const pad = navigator.getGamepads ? Array.from(navigator.getGamepads()).find(Boolean) : null;
        if (pad) {
          const up = pad.buttons[12]?.pressed || pad.axes[1] < -0.55;
          const down = pad.buttons[13]?.pressed || pad.axes[1] > 0.55;
          const confirm = pad.buttons[0]?.pressed || pad.buttons[1]?.pressed;

          if (up && !previousPadState.up) focusButton(index - 1);
          if (down && !previousPadState.down) focusButton(index + 1);
          if (confirm && !previousPadState.confirm) buttons[index].click();

          previousPadState = { up, down, confirm };
        }
        requestAnimationFrame(pollGamepad);
      }
      requestAnimationFrame(pollGamepad);
    </script>
  </body>
</html>
